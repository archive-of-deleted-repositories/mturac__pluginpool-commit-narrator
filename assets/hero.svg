<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="commit-narrator — Commit messages that say *why*, not just *what*.">
      <defs>
        <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#0d1117"/>
          <stop offset="100%" stop-color="#161b22"/>
        </linearGradient>
        <linearGradient id="accentLine" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#f78166" stop-opacity="0"/>
          <stop offset="50%" stop-color="#f78166" stop-opacity="1"/>
          <stop offset="100%" stop-color="#f78166" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="320" fill="url(#bg)"/>
      <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>
      <text x="60" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">commit-narrator</text>
      <text x="60" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#f78166">/commit-narrator</text>
      <text x="60" y="225" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" fill="#8b949e">Commit messages that say *why*, not just *what*.</text>
      <g transform="translate(820,60)">
    <rect x="0" y="40" width="320" height="120" rx="14" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="20" y="78" font-family="ui-monospace,monospace" font-size="16" fill="#56d364">feat(auth):</text>
    <text x="135" y="78" font-family="ui-monospace,monospace" font-size="16" fill="#e6edf3">throttle login</text>
    <line x1="20" y1="98" x2="280" y2="98" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="120" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e">WHY: prevent password-spray</text>
    <text x="20" y="140" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e">on /login. Threshold matches</text>
    <text x="20" y="158" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#8b949e">existing rate-limit constant.</text>
</g>
      <text x="60" y="290" font-family="ui-monospace,monospace" font-size="13" fill="#6e7681">pluginpool · MIT · Python 3 stdlib only</text>
    </svg>
